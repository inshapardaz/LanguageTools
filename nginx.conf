# Serves the LanguageTools single-page app. Listens on 8080 -- the port the old ASP.NET container
# used -- so the environment proxy's `proxy_pass http://languagetools:8080` keeps working unchanged.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets never change, so let browsers keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/natural-dictionary/12, /spelling, ...) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
