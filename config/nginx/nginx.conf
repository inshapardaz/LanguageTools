http {

  include mime.types;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  server {
    listen 80;
    # Also 8080, the port the old ASP.NET container used and the environment proxy still points
    # at (proxy_pass http://languagetools:8080). Drop it once the proxy is on port 80 everywhere.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    limit_req zone=mylimit burst=70 nodelay;

    location / {
            index  index.html index.htm;
            try_files $uri /index.html;
        }

    # Hashed build assets never change, so let browsers keep them.
    location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

    # Runtime environment config — must never be cached so config changes apply on restart.
    location = /env-config.js {
            add_header Cache-Control "no-store";
        }

    location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
  }
}

events {}
