# Type-checks and builds the front end on every push and pull request. (Docker image build and the
# production deploy are in docker-image.yml.)
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Nawishta.Web/ClientApp

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: src/Nawishta.Web/ClientApp/package-lock.json

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Type-check and build
      run: npm run build
